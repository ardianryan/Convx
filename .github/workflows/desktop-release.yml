name: Build and Publish Convx Desktop App (PPTI MangoTek)

on:
  push:
    branches:
      - main
    paths:
      - 'desktop/**'
      - 'scripts/certs/**'
      - '.github/workflows/desktop-release.yml'
    tags:
      - 'v*-desktop*'
      - 'v[0-9]*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-desktop:
    name: Build Desktop App (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows/amd64
            artifact_name: Convx-Desktop-Setup.exe
          - os: macos-latest
            platform: darwin/universal
            artifact_name: Convx-Desktop.dmg
          - os: ubuntu-latest
            platform: linux/amd64
            artifact_name: convx-desktop-linux.AppImage

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Go 1.27
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Linux Build Dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev osslsigncode

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build Frontend Assets
        shell: bash
        run: |
          cd web/frontend
          npm ci
          npm run build
          mkdir -p ../../desktop/frontend
          rm -rf ../../desktop/frontend/dist
          cp -r ../backend/dist ../../desktop/frontend/

      - name: Generate PPTI MangoTek Code Signing Certificates
        shell: bash
        run: |
          chmod +x scripts/certs/generate-certs.sh
          ./scripts/certs/generate-certs.sh

      - name: Build Wails App (${{ matrix.platform }})
        shell: bash
        run: |
          cd desktop
          if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            wails build -platform ${{ matrix.platform }} -tags webkit2_41 -clean
          else
            wails build -platform ${{ matrix.platform }} -clean
          fi

      - name: Sign Executable with PPTI MangoTek Certificate (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          chmod +x scripts/certs/sign-binary.sh
          if [ -f "desktop/build/bin/convx-desktop.exe" ]; then
            ./scripts/certs/sign-binary.sh desktop/build/bin/convx-desktop.exe windows
          fi
          cd desktop/build/bin
          cp ../../../scripts/certs/ppti-mangotek-rootca.crt .
          cp ../../../scripts/certs/install-trust.bat .
          7z a Convx-Windows-x64.zip convx-desktop.exe ppti-mangotek-rootca.crt install-trust.bat

      - name: Package & Sign macOS Bundle (DMG)
        if: matrix.os == 'macos-latest'
        run: |
          chmod +x scripts/certs/sign-binary.sh
          cd desktop/build/bin
          cp ../../../scripts/certs/ppti-mangotek-rootca.crt .
          cp ../../../scripts/certs/install-trust.sh .
          APP_NAME="Convx.app"
          if [ -d "convx-desktop.app" ]; then APP_NAME="convx-desktop.app"; fi
          ../../../scripts/certs/sign-binary.sh "$APP_NAME" macos
          mkdir -p dmg-staging
          cp -r "$APP_NAME" ppti-mangotek-rootca.crt install-trust.sh dmg-staging/
          ln -s /Applications dmg-staging/Applications
          hdiutil create -volname "Convx Desktop" -srcfolder dmg-staging -ov -format UDZO Convx-macOS-Universal.dmg

      - name: Package Linux Artifacts
        if: matrix.os == 'ubuntu-latest'
        run: |
          chmod +x scripts/certs/sign-binary.sh
          cd desktop/build/bin
          cp ../../../scripts/certs/ppti-mangotek-rootca.crt .
          cp ../../../scripts/certs/install-trust.sh .
          if [ -f "convx-desktop" ]; then
            ../../../scripts/certs/sign-binary.sh convx-desktop linux
            zip -r Convx-Linux-x64.zip convx-desktop ppti-mangotek-rootca.crt install-trust.sh
          fi

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Convx-Desktop-${{ matrix.os }}
          path: |
            desktop/build/bin/*.zip
            desktop/build/bin/*.dmg

  create-release:
    name: Create GitHub Release
    needs: build-desktop
    runs-on: ubuntu-latest
    if: success()
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./release-artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-desktop
          name: "Convx Desktop v1.0.0 Release (PPTI MangoTek)"
          body: |
            ## Convx Native Desktop App — Release Notes
            Official Native Desktop Application for Windows, macOS, and Linux built with **Wails** & **Svelte 5**.
            
            ### Code Signing & Security Verification
            - **Publisher**: PPTI MangoTek (`O=PPTI MangoTek`)
            - **Certificate**: PPTI MangoTek Code Signing Root CA
            - **Installation**: Includes automated PPTI MangoTek Certificate Register script (`install-trust.bat` / `install-trust.sh`) for silent trusted publisher status.
          draft: false
          prerelease: false
          overwrite: true
          files: |
            release-artifacts/**/*/*.zip
            release-artifacts/**/*/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
